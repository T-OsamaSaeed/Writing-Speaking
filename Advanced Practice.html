        const vocabProgramKey = "writing-speaking:vocab-program:start-date";
        let currentDay = 0;
        let questions = [];
        let index = 0;

        function parseDateKey(value) {
            const match = String(value || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
            return match ? new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3])) : null;
        }
        function getLocalMidnight(date) { return new Date(date.getFullYear(), date.getMonth(), date.getDate()); }
        function addDays(date, offset) { const result = new Date(date); result.setDate(result.getDate() + offset); return getLocalMidnight(result); }
        function formatDisplayDate(date) { return new Intl.DateTimeFormat("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" }).format(date); }
        function getProgramState(totalDays) {
            const today = getLocalMidnight(new Date());
            const startDate = parseDateKey(document.body.dataset.vocabStartDate) || today;
            const dayDifference = Math.floor((today.getTime() - startDate.getTime()) / 86400000);
            return { today: today, startDate: startDate, activeDayNumber: Math.max(1, Math.min(totalDays, dayDifference + 1)) };
        }
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i -= 1) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }
        function playAudio(text) {
            if (!('speechSynthesis' in window)) { return; }
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'en-US';
            msg.rate = 0.9;
            window.speechSynthesis.speak(msg);
        }
        function showScreen(name) {
            document.getElementById('screen-home').classList.toggle('hidden-screen', name !== 'home');
            document.getElementById('screen-day').classList.toggle('hidden-screen', name !== 'day');
            document.getElementById('screen-complete').classList.toggle('hidden-screen', name !== 'complete');
        }
        function initHome() {
            const grid = document.getElementById('days-grid');
            const state = getProgramState(lessonData.length);
            grid.innerHTML = '';
            lessonData.forEach(function (day, idx) {
                const dayNumber = idx + 1;
                const unlockDate = addDays(state.startDate, idx);
                const isDateOpen = dayNumber <= state.activeDayNumber;
                const isReady = day.ready !== false;
                const isUnlocked = isDateOpen && isReady;
                const button = document.createElement('button');
                button.className = 'practice-card rounded-3xl border p-5 text-left shadow-md ' + (isUnlocked ? 'bg-white border-indigo-100' : 'bg-slate-50 border-slate-200');
                button.innerHTML = isUnlocked
                    ? '<span class="text-xs text-indigo-500 uppercase tracking-widest font-black">Week 1</span><div class="mt-2 flex items-center justify-between gap-3"><span class="text-xl font-black text-slate-900">' + day.title + '</span><span class="inline-flex h-9 w-9 items-center justify-center rounded-full bg-indigo-50 text-indigo-600"><i class="fas fa-arrow-right text-xs"></i></span></div><p class="mt-3 text-sm font-semibold text-slate-500">Let\'s practice today\'s words.</p>'
                    : '<span class="text-xs text-slate-400 uppercase tracking-widest font-black">Day ' + dayNumber + '</span><div class="mt-2 flex items-center justify-between gap-3"><span class="text-xl font-black text-slate-500">Locked</span><span class="inline-flex h-9 w-9 items-center justify-center rounded-full bg-white border border-slate-200 text-slate-400"><i class="fas fa-lock text-xs"></i></span></div><p class="mt-3 text-sm font-semibold text-slate-400">' + (isReady ? 'Opens on ' + formatDisplayDate(unlockDate) + '.' : 'Words will be added later.') + '</p>';
                if (!isUnlocked) {
                    button.disabled = true;
                } else {
                    button.addEventListener('click', function () { startDay(idx); });
                }
                grid.appendChild(button);
            });
        }
        function startDay(dayIndex) {
            currentDay = dayIndex;
            questions = shuffle([...lessonData[dayIndex].words]);
            index = 0;
            document.getElementById('header-subtitle').textContent = lessonData[dayIndex].title;
            showQuestion();
            showScreen('day');
        }
        function showQuestion() {
            const word = questions[index];
            const choices = shuffle([word[0], ...questions.filter((item) => item[0] !== word[0]).slice(0, 3).map((item) => item[0])]);
            document.getElementById('current-number').textContent = String(index + 1);
            document.getElementById('total-number').textContent = String(questions.length);
            document.getElementById('question-title').textContent = word[1];
            document.getElementById('question-clue').textContent = word[2] + " / " + word[4];
            document.getElementById('feedback').textContent = '';
            document.getElementById('next-word').classList.add('hidden');
            const grid = document.getElementById('choice-grid');
            grid.innerHTML = '';
            choices.forEach(function (choice) {
                const btn = document.createElement('button');
                btn.className = 'choice-btn rounded-2xl border border-indigo-100 bg-indigo-50 px-5 py-4 text-left font-black text-indigo-800 hover:bg-indigo-100';
                btn.textContent = choice;
                btn.addEventListener('click', function () {
                    document.querySelectorAll('.choice-btn').forEach((item) => { item.disabled = true; });
                    if (choice === word[0]) {
                        btn.className = 'choice-btn rounded-2xl border border-emerald-200 bg-emerald-50 px-5 py-4 text-left font-black text-emerald-700';
                        document.getElementById('feedback').className = 'mt-5 min-h-[2rem] text-lg font-black text-emerald-600';
                        document.getElementById('feedback').textContent = 'Correct. ' + word[0];
                        playAudio(word[0]);
                    } else {
                        btn.className = 'choice-btn rounded-2xl border border-red-200 bg-red-50 px-5 py-4 text-left font-black text-red-700';
                        document.getElementById('feedback').className = 'mt-5 min-h-[2rem] text-lg font-black text-red-500';
                        document.getElementById('feedback').textContent = 'Try again in the next round. Correct answer: ' + word[0];
                    }
                    document.getElementById('next-word').classList.remove('hidden');
                });
                grid.appendChild(btn);
            });
        }
        function nextWord() {
            if (index < questions.length - 1) {
                index += 1;
                showQuestion();
                return;
            }
            showScreen('complete');
        }
        document.getElementById('back-home').addEventListener('click', function () { showScreen('home'); document.getElementById('header-subtitle').textContent = 'Select a Day'; });
        document.getElementById('listen-btn').addEventListener('click', function () { if (questions[index]) { playAudio(questions[index][0]); } });
        document.getElementById('next-word').addEventListener('click', nextWord);
        document.getElementById('restart-practice').addEventListener('click', function () { startDay(currentDay); });
        initHome();
        const params = new URLSearchParams(window.location.search);
        const requested = Number(params.get('day'));
        const state = getProgramState(lessonData.length);
        if (Number.isFinite(requested) && requested >= 1 && requested <= lessonData.length && requested <= state.activeDayNumber && lessonData[requested - 1].ready !== false) {
            startDay(requested - 1);
        }
