        function playAudio(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'en-US';
                msg.rate = 0.9;
                window.speechSynthesis.speak(msg);
            } else {
                alert("Sorry, your browser doesn't support text-to-speech.");
            }
        }

        const vocabProgramKey = "writing-speaking:vocab-program:start-date";
        const vocabDayCompletionPrefix = "writing-speaking:vocab-day:";

        function getLocalMidnight(date) { return new Date(date.getFullYear(), date.getMonth(), date.getDate()); }
        function formatDateKey(date) { return date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0") + "-" + String(date.getDate()).padStart(2, "0"); }
        function parseDateKey(value) {
            const match = String(value || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
            return match ? new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3])) : null;
        }
        function getConfiguredStartDate() { return parseDateKey(document.body.dataset.vocabStartDate); }
        function readProgramStartDate() {
            try { return parseDateKey(localStorage.getItem(vocabProgramKey)); } catch (error) { return null; }
        }
        function writeProgramStartDate(value) {
            try { localStorage.setItem(vocabProgramKey, formatDateKey(value)); } catch (error) { return; }
        }
        function getCompletionKey(dayNumber) { return vocabDayCompletionPrefix + String(dayNumber) + ":completed"; }
        function readDayCompletion(dayNumber) {
            try { return localStorage.getItem(getCompletionKey(dayNumber)) === "true"; } catch (error) { return false; }
        }
        function writeDayCompletion(dayNumber) {
            try { localStorage.setItem(getCompletionKey(dayNumber), "true"); } catch (error) { return; }
        }
        function addDays(date, offset) {
            const result = new Date(date);
            result.setDate(result.getDate() + offset);
            return getLocalMidnight(result);
        }
        function formatDisplayDate(date) {
            return new Intl.DateTimeFormat("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" }).format(date);
        }
        function getProgramState(totalDays) {
            const today = getLocalMidnight(new Date());
            const configuredStartDate = getConfiguredStartDate();
            let startDate = configuredStartDate || readProgramStartDate();
            if (!startDate || startDate.getTime() > today.getTime()) {
                startDate = configuredStartDate || today;
                if (!configuredStartDate) { writeProgramStartDate(startDate); }
            }
            const dayDifference = Math.floor((today.getTime() - startDate.getTime()) / 86400000);
            return { today: today, startDate: startDate, activeDayNumber: Math.max(1, Math.min(totalDays, dayDifference + 1)) };
        }
        function getRequestedDayNumber() {
            const params = new URLSearchParams(window.location.search);
            const directDay = Number(params.get('day'));
            return Number.isFinite(directDay) && directDay >= 1 && directDay <= lessonData.length ? directDay : null;
        }

            if (downloadButton) {
                downloadButton.classList.toggle('hidden', !showDownload);
                downloadButton.disabled = !showDownload;
                downloadButton.setAttribute('aria-hidden', String(!showDownload));
            }
        }
